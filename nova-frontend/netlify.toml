[build]
  command = "vite build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  external_node_modules = ["got-scraping", "@consumet/extensions"]

[functions."api"]
  included_files = ["server/**"]

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — /api/* is handled by the v2 function config.path, not a redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
