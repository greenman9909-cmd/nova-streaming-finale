<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="25" fill="#0f1117" />

  <circle cx="50" cy="50" r="30" fill="url(#glow)" />
  <circle cx="50" cy="50" r="12" fill="#ffffff" />

  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#grad)" stroke-width="3" stroke-dasharray="25 10" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-dasharray="15 25" opacity="0.6" />
</svg>
